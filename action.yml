name: "lintocaml"
description: "Lint an OCaml project from its typed AST, fail at the severity you choose, and upload findings to code scanning"
author: "at649"

branding:
  icon: "check-circle"
  color: "orange"

inputs:
  paths:
    description: "Directories to scan, one per line"
    required: false
    default: "_build"
  profile:
    description: "default | idiomatic | pedantic"
    required: false
    default: "default"
  fail-on:
    description: "error | warning | hint | never"
    required: false
    default: "error"
  build:
    description: "Run 'dune build @check' before linting. Disable if the workflow already built the project."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload results to GitHub code scanning. Requires security-events: write."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install lintocaml
      shell: bash
      run: |
        opam pin add --no-action --yes lintocaml "$GITHUB_ACTION_PATH"
        opam install --yes lintocaml

    - name: Build compiler artifacts
      if: inputs.build == 'true'
      shell: bash
      run: opam exec -- dune build @check

    - name: Run lintocaml
      id: lint
      shell: bash
      env:
        LINTOCAML_PATHS: ${{ inputs.paths }}
        LINTOCAML_PROFILE: ${{ inputs.profile }}
        LINTOCAML_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        paths=()
        while IFS= read -r path; do
          if [[ -n "$path" ]]; then
            paths+=("$path")
          fi
        done <<< "$LINTOCAML_PATHS"

        if [[ ${#paths[@]} -eq 0 ]]; then
          echo "lintocaml: the paths input must name at least one directory" >&2
          exit 2
        fi

        opam exec -- lintocaml --no-color --format sarif --fail-on never \
          --profile "$LINTOCAML_PROFILE" -- "${paths[@]}" > lintocaml.sarif

        status=0
        opam exec -- lintocaml --no-color --fail-on "$LINTOCAML_FAIL_ON" \
          --profile "$LINTOCAML_PROFILE" -- "${paths[@]}" || status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && hashFiles('lintocaml.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: lintocaml.sarif

    - name: Fail the job when findings exceed the threshold
      if: always() && steps.lint.outputs.status != '' && steps.lint.outputs.status != '0'
      shell: bash
      env:
        LINTOCAML_STATUS: ${{ steps.lint.outputs.status }}
      run: exit "$LINTOCAML_STATUS"
