- id: lintml
  name: lintml
  description: >
    Lint the typed artifacts dune produces. Requires the project to be built;
    lintml exits 3 with instructions when no artifacts are found.
  entry: lintml --no-color
  language: system
  types: [file]
  files: \.mli?$
  pass_filenames: false
  require_serial: true

- id: lintml-with-build
  name: lintml (build first)
  description: Build compiler artifacts, then lint them.
  entry: bash -c 'dune build @check && lintml --no-color'
  language: system
  types: [file]
  files: \.mli?$
  pass_filenames: false
  require_serial: true
